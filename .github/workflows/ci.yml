name: ci

# Runs on every push to main and on every pull request. It was manual-only
# from 2026-11-11 to 2026-11-15, while the repo was private and the free
# allowance (2,000 minutes) was spent (215 runs, about 2,011 minutes). The repo
# is public now, which makes Actions minutes free. scripts/ci-local still runs
# the same checks locally, and the coder and auditor prompts point at this file
# for WHAT to run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to the same PR cancels the older run instead of queueing it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rework_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REWORK_TEST_POSTGRES: postgresql://postgres:postgres@localhost:5432/rework_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest -m "not smoke"
